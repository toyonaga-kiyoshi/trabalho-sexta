<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Alunos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="topo">

            <div>
                <h1>Cadastro de Alunos</h1>

                <p class="subtitulo">
                    Gerencie os alunos cadastrados
                </p>
            </div>

            <button
                type="button"
                id="btn-novo"
                class="btn btn-primario">
                + Novo aluno
            </button>

        </header>


        <div id="msg" class="msg" hidden></div>


        <section class="painel">

            <div class="painel-cabecalho">

                <h2>Alunos cadastrados</h2>

                <button
                    type="button"
                    id="btn-atualizar"
                    class="btn btn-secundario">
                    Atualizar lista
                </button>

            </div>


            <table>

                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>RA</th>
                        <th>Curso</th>
                        <th class="acoes">Ações</th>
                    </tr>
                </thead>

                <tbody id="tabela-alunos">

                    <tr>
                        <td colspan="4" class="vazio">
                            Carregando...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </div>


    <div id="modal" class="modal" hidden>

        <div
            class="modal-fundo"
            id="modal-fundo">
        </div>


        <div
            class="modal-caixa"
            role="dialog"
            aria-modal="true">

            <h2 id="modal-titulo">
                Novo aluno
            </h2>


            <form id="form-aluno">

                <label>
                    Nome

                    <input
                        id="nome"
                        type="text"
                        required
                        autocomplete="off">
                </label>


                <label>
                    RA

                    <input
                        id="ra"
                        type="text"
                        required
                        autocomplete="off">
                </label>


                <label>
                    Curso

                    <input
                        id="curso"
                        type="text"
                        autocomplete="off">
                </label>


                <div class="modal-acoes">

                    <button
                        type="button"
                        id="btn-cancelar">
                        Cancelar
                    </button>

                    <button type="submit">
                        Salvar
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
